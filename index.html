<html>
<!--so, spotify should have full metadata (album art, title, artist, album, etc etc)-->
<head>
    <title>simplDownldr</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <h1 class="title dropshadow">simplDownldr</h1>

    <div class="platformSelect">
        <p>select the platform:</p>
        <select class="dropshadow rounded dropdown" style="width: 220px">
            <option value="1">YouTube</option>
            <option value="2">X</option>
            <option value="3">Spotify</option>
        </select>
    </div>

    <div class="formatSelect">
        <p class="dropshadow">select the media format:</p>
        <select class="dropshadow rounded dropdown" style="width: 275px">
            <option value="1">.mp3</option>
            <option value="2">.mp4</option>
            <option value="3">Spotify</option>
        </select>
    </div>

    <img src="imgs/cat_ascii.png" class="catascii" />
</body>

</html>
